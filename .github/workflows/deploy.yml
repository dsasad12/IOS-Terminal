name: Deploy HackTerm PWA

on:
  push:
    branches: [main, master, claude/ios-linux-terminal-2ZelI]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build PWA
        run: cd web && npm run build

      # Option A: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          cname: ${{ vars.CUSTOM_DOMAIN }}   # optional: set repo variable CUSTOM_DOMAIN

      # Option B: Deploy to Netlify (uncomment + set secrets)
